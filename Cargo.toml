[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
hydra-core = { path = "crates/hydra-core" }
hydra-platform = { path = "crates/hydra-platform" }
hydra-providers = { path = "crates/hydra-providers" }
hydraui-term = { path = "crates/hydraui-term" }
hydraui-sets = { path = "crates/hydraui-sets" }
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
gpui-component = "=0.7.3"
gpui-kit-assets = "=0.7.3"
futures = "0.3"
ignore = "0.4"
notify = "8"
anstream = "1"
anstyle = "1"
anyhow = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "6"
keyring = { version = "3", features = ["windows-native"] }
predicates = "3"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
junction = "1"
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
sha2 = "0.10"
ureq = "2"
portable-pty = "0.9.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
alacritty_terminal = "0.26.0"
