name: ci
# Branches are checked through their pull request, so each change runs once.
on:
  push:
    branches: [main]
  pull_request:
# Pushes to main run one at a time, so two releases can't pick the same version. A run still
# waiting when a newer one queues is dropped; the newer one releases its commits too.
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Enough for backtraces, and keeps the cached target folder small.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Dependencies come from the cache; only the workspace's crates rebuild. Only main saves
      # one: pull requests can read main's caches, but a cache a pull request saves serves only
      # that pull request, and fills the repo's 10 GB until main's are pushed out.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The tests that sync real nodes run two at a time and get retries: see
      # .config/nextest.toml. nextest doesn't run doc tests, so cargo test does those.
      - run: cargo nextest run --workspace --all-features --profile ci
      - run: cargo test --workspace --all-features --doc

  version:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Decide the version
        id: decide
        shell: bash
        run: |
          next="$(bash scripts/next-version.sh)"
          if [ "$next" = "skip" ]; then
            echo "only docs changed since the last release - not releasing"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing $next"
            echo "version=$next" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Windows and macOS build side by side. Windows publishes the release.
  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        env:
          HYDRA_VERSION: ${{ env.VERSION }}
        run: cargo build --release -p hydra-cli -p hydraui -p hydra-setup
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/hydra.exe dist/hydra-x86_64-pc-windows-msvc.exe
          cd dist
          sha256sum hydra-x86_64-pc-windows-msvc.exe | awk '{print tolower($1) "  hydra-x86_64-pc-windows-msvc.exe"}' > hydra-x86_64-pc-windows-msvc.exe.sha256
          cat hydra-x86_64-pc-windows-msvc.exe.sha256
          cd ..
          cp target/release/hydraui.exe dist/hydraui-x86_64-pc-windows-msvc.exe
          cd dist
          sha256sum hydraui-x86_64-pc-windows-msvc.exe | awk '{print tolower($1) "  hydraui-x86_64-pc-windows-msvc.exe"}' > hydraui-x86_64-pc-windows-msvc.exe.sha256
          cat hydraui-x86_64-pc-windows-msvc.exe.sha256
          cd ..
          cp target/release/hydra-setup.exe dist/hydra-setup.exe
          cd dist
          sha256sum hydra-setup.exe | awk '{print tolower($1) "  hydra-setup.exe"}' > hydra-setup.exe.sha256
          cat hydra-setup.exe.sha256
      - name: Check the version
        shell: bash
        run: |
          got="$(dist/hydra-x86_64-pc-windows-msvc.exe --version | tr -d '\r')"
          echo "$got"
          if [ "$got" != "hydra $VERSION" ]; then
            echo "expected 'hydra $VERSION', got '$got'" >&2
            exit 1
          fi
      - name: Check hydraui's version
        shell: pwsh
        run: |
          $got = (Get-Item dist/hydraui-x86_64-pc-windows-msvc.exe).VersionInfo.ProductVersion
          Write-Host "hydraui $got"
          if ($got -ne $env:VERSION) {
            Write-Error "expected hydraui $env:VERSION, got '$got'"
            exit 1
          }
      - name: Test the installer
        shell: pwsh
        run: ./scripts/test-setup.ps1 -Setup dist/hydra-setup.exe -From dist -Version $env:VERSION
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "hydra $VERSION" --generate-notes

  # macOS builds beside Windows and hands its assets to the next job, which adds them to the
  # release once Windows has published it. A shortage of macOS runners delays only these
  # assets, never the release itself.
  release-macos:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          HYDRA_VERSION: ${{ env.VERSION }}
        run: cargo build --release -p hydra-cli -p hydraui
      - name: Package
        run: |
          mkdir -p dist
          for bin in hydra hydraui; do
            asset="$bin-aarch64-apple-darwin"
            cp "target/release/$bin" "dist/$asset"
            (cd dist && shasum -a 256 "$asset" > "$asset.sha256" && cat "$asset.sha256")
          done
      - name: Check the version
        run: |
          got="$(dist/hydra-aarch64-apple-darwin --version)"
          echo "$got"
          if [ "$got" != "hydra $VERSION" ]; then
            echo "expected 'hydra $VERSION', got '$got'" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: dist/
          retention-days: 1

  release-macos-upload:
    needs: [version, release, release-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-assets
          path: dist
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY"
