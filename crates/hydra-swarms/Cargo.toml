[package]
name = "hydra-swarms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
hydra-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
iroh.workspace = true
getrandom.workspace = true
jiff.workspace = true
iroh-blobs.workspace = true
iroh-docs.workspace = true
iroh-gossip.workspace = true
tokio = { workspace = true, features = ["net"] }
anyhow.workspace = true
bytes.workspace = true
futures.workspace = true
sha2.workspace = true
base64.workspace = true
notify.workspace = true
ignore.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
junction.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

# macOS goes through /usr/bin/security (hydra-platform's macos_keychain), so "Always Allow"
# lasts across rebuilds; the Security framework would ask again after every build.
[target.'cfg(target_os = "macos")'.dependencies]
hydra-platform.workspace = true

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
keyring.workspace = true
