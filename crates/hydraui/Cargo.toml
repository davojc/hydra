[package]
name = "hydraui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "hydraui"
path = "src/main.rs"

[dependencies]
hydra-core.workspace = true
hydra-platform.workspace = true
hydra-providers.workspace = true
hydra-update.workspace = true
dirs.workspace = true
hydraui-term.workspace = true
hydraui-sets.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-kit-assets.workspace = true
gpui-base.workspace = true
gpui-component.workspace = true
futures.workspace = true
ignore.workspace = true
regex.workspace = true
notify.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
semver.workspace = true
anyhow.workspace = true
sha2.workspace = true
raw-window-handle = "0.6"
serde-saphyr = "1.3"
serde_json.workspace = true
tiny_http.workspace = true
getrandom.workspace = true
keyring.workspace = true
ureq.workspace = true
# For the grammars hydraui builds itself (src/grammars.rs); the versions gpui-component uses.
tree-sitter = "0.26"
tree-sitter-language = "0.1"
# gpui-component's GraphQL, Protobuf and C# grammars, which it ships without colour rules,
# and its SQL one, whose rules use names its theme doesn't know.
tree-sitter-graphql = "0.1"
tree-sitter-proto = "0.2"
tree-sitter-c-sharp = "0.23"
tree-sitter-sequel = "0.3"
# Draws PDF pages in the file pane: pure Rust, so there is no PDF library to ship.
hayro = "0.8"

[dev-dependencies]
hydra-update = { workspace = true, features = ["fake"] }
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-sys.workspace = true
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[build-dependencies]
winresource = "0.1"
cc = "1"
