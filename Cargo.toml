[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
hydra-core = { path = "crates/hydra-core" }
hydra-platform = { path = "crates/hydra-platform" }
hydra-providers = { path = "crates/hydra-providers" }
hydraui-term = { path = "crates/hydraui-term" }
hydraui-sets = { path = "crates/hydraui-sets" }
hydra-update = { path = "crates/hydra-update" }
hydra-link = { path = "crates/hydra-link" }
hydra-swarms = { path = "crates/hydra-swarms" }
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
gpui-base = "=0.7.3"
gpui-component = { version = "=0.7.3", features = [
    "tree-sitter-rust", "tree-sitter-toml", "tree-sitter", "tree-sitter-markdown",
    "tree-sitter-markdown-inline", "tree-sitter-javascript", "tree-sitter-typescript",
    "tree-sitter-tsx", "tree-sitter-python", "tree-sitter-bash", "tree-sitter-yaml",
    "tree-sitter-css", "tree-sitter-html", "tree-sitter-go", "tree-sitter-c",
    "tree-sitter-cpp", "tree-sitter-csharp", "tree-sitter-make", "tree-sitter-java",
    "tree-sitter-sql", "tree-sitter-graphql", "tree-sitter-proto",
] }
gpui-kit-assets = "=0.7.3"
futures = "0.3"
iroh = "1"
iroh-docs = "0.101"
iroh-blobs = "0.103"
iroh-gossip = "0.101"
jiff = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
ignore = "0.4"
regex = "1"
notify = "8"
anstream = "1"
anstyle = "1"
anyhow = "1"
bytes = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "6"
keyring = "3"
predicates = "3"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
junction = "1"
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
sha2 = "0.10"
base64 = "0.22"
ureq = "2"
portable-pty = "0.9.0"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
alacritty_terminal = "0.26.0"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
getrandom = "0.3"
tiny_http = "0.12"
