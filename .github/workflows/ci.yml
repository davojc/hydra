name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Dependencies come from the cache; only the workspace's crates rebuild.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Decide the version
        id: decide
        shell: bash
        run: |
          next="$(bash scripts/next-version.sh)"
          if [ "$next" = "skip" ]; then
            echo "only docs changed since the last release - not releasing"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing $next"
            echo "version=$next" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      # Only runs that release build anything, so only they restore or save the cache.
      - uses: Swatinem/rust-cache@v2
        if: steps.decide.outputs.release == 'true'
      - name: Build
        if: steps.decide.outputs.release == 'true'
        shell: bash
        env:
          HYDRA_VERSION: ${{ steps.decide.outputs.version }}
        run: cargo build --release -p hydra-cli -p hydraui -p hydra-setup
      - name: Package
        if: steps.decide.outputs.release == 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/hydra.exe dist/hydra-x86_64-pc-windows-msvc.exe
          cd dist
          sha256sum hydra-x86_64-pc-windows-msvc.exe | awk '{print tolower($1) "  hydra-x86_64-pc-windows-msvc.exe"}' > hydra-x86_64-pc-windows-msvc.exe.sha256
          cat hydra-x86_64-pc-windows-msvc.exe.sha256
          cd ..
          cp target/release/hydraui.exe dist/hydraui-x86_64-pc-windows-msvc.exe
          cd dist
          sha256sum hydraui-x86_64-pc-windows-msvc.exe | awk '{print tolower($1) "  hydraui-x86_64-pc-windows-msvc.exe"}' > hydraui-x86_64-pc-windows-msvc.exe.sha256
          cat hydraui-x86_64-pc-windows-msvc.exe.sha256
          cd ..
          cp target/release/hydra-setup.exe dist/hydra-setup.exe
          cd dist
          sha256sum hydra-setup.exe | awk '{print tolower($1) "  hydra-setup.exe"}' > hydra-setup.exe.sha256
          cat hydra-setup.exe.sha256
      - name: Check the version
        if: steps.decide.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          got="$(dist/hydra-x86_64-pc-windows-msvc.exe --version | tr -d '\r')"
          echo "$got"
          if [ "$got" != "hydra $VERSION" ]; then
            echo "expected 'hydra $VERSION', got '$got'" >&2
            exit 1
          fi
      - name: Check hydraui's version
        if: steps.decide.outputs.release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          $got = (Get-Item dist/hydraui-x86_64-pc-windows-msvc.exe).VersionInfo.ProductVersion
          Write-Host "hydraui $got"
          if ($got -ne $env:VERSION) {
            Write-Error "expected hydraui $env:VERSION, got '$got'"
            exit 1
          }
      - name: Test the installer
        if: steps.decide.outputs.release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: ./scripts/test-setup.ps1 -Setup dist/hydra-setup.exe -From dist -Version $env:VERSION
      - name: Publish the release
        if: steps.decide.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "hydra $VERSION" --generate-notes

  # The macOS builds join the release the Windows job published. A separate job, so a
  # shortage of macOS runners delays only these assets, never the release itself.
  release-macos:
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          HYDRA_VERSION: ${{ needs.release.outputs.version }}
        run: cargo build --release -p hydra-cli -p hydraui
      - name: Package
        run: |
          mkdir -p dist
          for bin in hydra hydraui; do
            asset="$bin-aarch64-apple-darwin"
            cp "target/release/$bin" "dist/$asset"
            (cd dist && shasum -a 256 "$asset" > "$asset.sha256" && cat "$asset.sha256")
          done
      - name: Check the version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          got="$(dist/hydra-aarch64-apple-darwin --version)"
          echo "$got"
          if [ "$got" != "hydra $VERSION" ]; then
            echo "expected 'hydra $VERSION', got '$got'" >&2
            exit 1
          fi
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "v$VERSION" dist/*
